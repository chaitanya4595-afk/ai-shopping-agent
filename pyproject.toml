[project]
name = "ai-shopping-agent"
version = "0.1.0"
description = "Tool-using multimodal shopping agent built with LangChain, Groq, SQLite, and Streamlit."
requires-python = ">=3.12,<3.13"
dependencies = [
    "streamlit>=1.57",
    "langchain>=1.4",
    "langchain-core>=1.6",
    "langchain-groq>=1.1",
    "groq>=0.37",
    "python-dotenv>=1.2",
]

[project.optional-dependencies]
dev = ["pytest>=8.0"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/ai_shopping_agent"]

[tool.pytest.ini_options]
pythonpath = ["src"]
